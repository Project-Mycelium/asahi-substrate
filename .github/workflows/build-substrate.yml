---
name: Build Substrate Image

# Builds Formless Substrate on Fedora Asahi Remix base
# This is the working configuration for Apple Silicon

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/build-substrate.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # 6am UTC every Monday

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/asahi-substrate
  BASE_IMAGE: quay.io/fedora-asahi-remix-atomic-desktops/base-atomic:42

jobs:
  build:
    name: Build Formless Substrate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up environment
        run: |
          echo "BUILD_DATE=$(date -u +%Y%m%d)" >> $GITHUB_ENV

      - name: Build substrate image
        working-directory: src
        run: |
          podman build \
            --platform linux/arm64 \
            --build-arg BASE_IMAGE=${{ env.BASE_IMAGE }} \
            -f Containerfile.substrate \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.BUILD_DATE }} \
            .

      - name: Verify Asahi kernel
        run: |
          echo "=== Checking kernel ==="
          podman run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            ls /usr/lib/modules/ | head -1
          podman run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            cat /etc/hostname

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request'
        run: |
          podman push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          podman push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.BUILD_DATE }}

      - name: Summary
        run: |
          SIZE=$(podman images ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest --format "{{.Size}}")
          echo "## Formless Substrate Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "**Size:** $SIZE" >> $GITHUB_STEP_SUMMARY
          echo "**Base:** Fedora Asahi Remix 42" >> $GITHUB_STEP_SUMMARY
          echo "**Kernel:** Asahi (Apple Silicon)" >> $GITHUB_STEP_SUMMARY
