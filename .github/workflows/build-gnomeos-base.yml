---
name: Build GNOME OS Base (aarch64)

# This workflow builds GNOME OS from source using BuildStream
# Output: OCI image published to ghcr.io for use as substrate base

on:
  # Manual trigger with options
  workflow_dispatch:
    inputs:
      gnome_version:
        description: 'GNOME OS branch (master, gnome-47, etc.)'
        required: false
        default: 'master'
      force_rebuild:
        description: 'Force full rebuild (ignore cache)'
        required: false
        default: 'false'
        type: boolean

  # Weekly rebuild to stay current with GNOME nightly
  schedule:
    - cron: '0 4 * * 0'  # 4am UTC every Sunday

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/gnomeos-base-aarch64
  GNOME_BUILD_META_REPO: https://gitlab.gnome.org/GNOME/gnome-build-meta.git

jobs:
  build-gnomeos:
    name: Build GNOME OS OCI (aarch64)
    runs-on: ubuntu-24.04-arm  # Native ARM64 runner
    timeout-minutes: 480  # 8 hours max (BuildStream builds are slow)

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout asahi-substrate
        uses: actions/checkout@v4

      - name: Set up environment
        run: |
          echo "IMAGE_REGISTRY=${REGISTRY,,}" >> $GITHUB_ENV
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date -u +%Y%m%d)" >> $GITHUB_ENV
          echo "GNOME_BRANCH=${{ github.event.inputs.gnome_version || 'master' }}" >> $GITHUB_ENV

      - name: Free disk space
        run: |
          # BuildStream needs lots of space
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Install BuildStream dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            python3-venv \
            bubblewrap \
            fuse3 \
            libfuse3-dev \
            ostree \
            flatpak \
            qemu-user-static

          # Install BuildStream 2
          python3 -m venv ~/.bst-venv
          source ~/.bst-venv/bin/activate
          pip install BuildStream

      - name: Clone gnome-build-meta
        run: |
          git clone --depth 1 --branch ${{ env.GNOME_BRANCH }} \
            ${{ env.GNOME_BUILD_META_REPO }} gnome-build-meta
          cd gnome-build-meta
          echo "GNOME_COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Cache BuildStream artifacts
        uses: actions/cache@v4
        if: ${{ github.event.inputs.force_rebuild != 'true' }}
        with:
          path: ~/.cache/buildstream
          key: bst-aarch64-${{ env.GNOME_BRANCH }}-${{ hashFiles('gnome-build-meta/project.conf') }}
          restore-keys: |
            bst-aarch64-${{ env.GNOME_BRANCH }}-
            bst-aarch64-

      - name: Build GNOME OS OCI image
        run: |
          source ~/.bst-venv/bin/activate
          cd gnome-build-meta

          # Build the OCI image for native aarch64 (no -o arch needed on ARM64 runner)
          echo "Building GNOME OS OCI image..."
          bst --colors build oci/gnomeos.bst

          # Also build the devel variant for debugging
          bst --colors build oci/gnomeos-devel.bst

      - name: Export OCI images
        run: |
          source ~/.bst-venv/bin/activate
          cd gnome-build-meta

          # Export to OCI tarball
          mkdir -p ../output
          bst artifact checkout --tar ../output/gnomeos-aarch64.tar oci/gnomeos.bst
          bst artifact checkout --tar ../output/gnomeos-devel-aarch64.tar oci/gnomeos-devel.bst

          ls -lh ../output/

      - name: Load and tag images
        run: |
          # Load into podman
          podman load < output/gnomeos-aarch64.tar
          podman load < output/gnomeos-devel-aarch64.tar

          # Tag with our registry
          podman tag gnomeos:latest ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:nightly
          podman tag gnomeos:latest ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.BUILD_DATE }}
          podman tag gnomeos:latest ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.GNOME_COMMIT }}

          podman tag gnomeos-devel:latest ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-devel:nightly

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images
        run: |
          podman push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:nightly
          podman push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.BUILD_DATE }}
          podman push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.GNOME_COMMIT }}
          podman push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-devel:nightly

      - name: Summary
        run: |
          echo "## GNOME OS aarch64 Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Images published:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:nightly\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.BUILD_DATE }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-devel:nightly\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Source:** gnome-build-meta @ ${{ env.GNOME_COMMIT }} (${{ env.GNOME_BRANCH }})" >> $GITHUB_STEP_SUMMARY
